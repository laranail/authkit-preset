name: Tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        php: [ 8.4, 8.5 ]
        laravel: [ 13.* ]
        stability: [ prefer-stable ]
        include:
          - laravel: 13.*
            testbench: 11.*
            carbon: ^3.0

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, sqlite3, pdo_sqlite, zip
          coverage: pcov

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      # laranail/authkit-social is PRIVATE and is a hard `require` here, so composer
      # has to clone it. GITHUB_TOKEN cannot: it is scoped to the repository the
      # workflow runs in, which is why the failure reads as "Invalid username or
      # token" against a token that is present and valid for everything else.
      # LARANAIL_REPO_TOKEN is a PAT (or GitHub App token) with read access to the
      # laranail org; the fallback keeps the public dependencies resolving and the
      # rest of the family's workflows unchanged.
      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.LARANAIL_REPO_TOKEN || secrets.GITHUB_TOKEN }}"}}'
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: ./vendor/bin/pest --parallel
