name: Tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Calls the one shared definition in laranail/.github. Everything this file used
# to spell out -- the PHP matrix, the composer cache and its laranail eviction,
# prefer-lowest, fail-fast, timeouts -- lives there now, so a change to how this
# family tests is one edit instead of fifty.
jobs:
  pest:
    uses: laranail/.github/.github/workflows/tests.yml@main
    with:
      # Pin nothing: resolve whatever composer.json allows. The shared workflow
      # still defaults laravel-versions to ["13.*"], which runs
      # `composer require illuminate/contracts` and REWRITES composer.json, so
      # the suite would test a manifest this package does not ship. Remove this
      # line only once that default is ["*"].
      laravel-versions: '["*"]'
      php-extensions: 'dom, curl, libxml, mbstring, sqlite3, pdo_sqlite, zip'
      test-command: 'vendor/bin/pest --parallel --colors=never'
    # No secrets. `laranail/authkit-social-login` is PUBLIC, so composer clones it
    # anonymously and needs no token.
    #
    # This block used to pass COMPOSER_AUTH_TOKEN from LARANAIL_REPO_TOKEN, for the
    # period when that dependency was private. Two things were wrong with it by the
    # time it was removed: the dependency is public, and LARANAIL_REPO_TOKEN was
    # never created -- this repository has no secrets and the org exposes none, so
    # the expression resolved to the empty string and configured composer auth with
    # a blank token. That is why the install step failed with a clone error naming
    # an SSH url the manifest does not contain: composer's GitHubDriver fell back
    # from the API to a direct clone and rewrote the url itself.
    #
    # If a private laranail dependency is ever added here, the token has to be
    # created before the wiring is restored, not alongside it.
